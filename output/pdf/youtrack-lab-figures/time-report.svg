<svg xmlns="http://www.w3.org/2000/svg" width="840" height="225" viewBox="0 0 840 225">
<style>text{font-family:Arial,sans-serif;fill:#273449}.title{font-size:20px;font-weight:700}.label{font-size:14px}.small{font-size:12px;fill:#657286}.grid{stroke:#dfe4ea;stroke-width:1}</style>
<rect width="100%" height="100%" fill="white"/><text class="title" x="24" y="32">План и смоделированное списанное время</text><line class="grid" x1="260.0" y1="54" x2="260.0" y2="164"/><text class="small" text-anchor="middle" x="260.0" y="185">0k</text><line class="grid" x1="366.0" y1="54" x2="366.0" y2="164"/><text class="small" text-anchor="middle" x="366.0" y="185">2k</text><line class="grid" x1="472.0" y1="54" x2="472.0" y2="164"/><text class="small" text-anchor="middle" x="472.0" y="185">4k</text><line class="grid" x1="578.0" y1="54" x2="578.0" y2="164"/><text class="small" text-anchor="middle" x="578.0" y="185">6k</text><line class="grid" x1="684.0" y1="54" x2="684.0" y2="164"/><text class="small" text-anchor="middle" x="684.0" y="185">8k</text><line class="grid" x1="790.0" y1="54" x2="790.0" y2="164"/><text class="small" text-anchor="middle" x="790.0" y="185">10k</text><text class="label" text-anchor="end" x="248" y="93">Оценка 55 листовых задач</text><rect x="260" y="76" width="530.0" height="24" rx="3" fill="#2f6fed"/><text class="label" x="798.0" y="93">10 000 ч</text><text class="label" text-anchor="end" x="248" y="141">Work items в симуляции</text><rect x="260" y="124" width="21.2" height="24" rx="3" fill="#0fa58b"/><text class="label" x="289.2" y="141">400 ч</text><text class="small" x="260" y="212">Шкала — тысячи часов. 400 ч внесены администратором на родительских задачах, план — по листовым задачам.</text></svg>